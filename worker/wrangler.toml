name = "mncoleman-admin-auth"
main = "index.ts"
compatibility_date = "2024-04-01"

# Public environment variables
# Secrets (set via `wrangler secret put`):
#   TELEGRAM_CLIENT_SECRET  — OIDC client secret from BotFather
#   JWT_SECRET              — Signs session JWTs
#   OWNER_SUB               — Owner's Telegram OIDC sub (always allowed)
#   GITHUB_TOKEN            — GitHub API access
#   ARTIFACTS_JWT_SECRET    — Shared HS256 secret with the Oracle artifact service
#   GA_SA_CLIENT_EMAIL      — Google service-account email (Viewer on the GA4 property)
#   GA_SA_PRIVATE_KEY       — That service account's PKCS#8 private key (PEM)
[vars]
TELEGRAM_BOT_ID = "8681257901"  # mncolemandotcombot — OIDC client_id
FRONTEND_URL = "https://mncoleman.com"
GITHUB_REPO_OWNER = "mncoleman"
GITHUB_REPO_NAME = "mncoleman"
N8N_WEBHOOK_URL = ""
ARTIFACTS_SERVICE_URL = "https://artifacts.mncoleman.com"
GA_PROPERTY_ID = "515551096"    # GA4 numeric property id — not the G- measurement id

[[kv_namespaces]]
binding = "ADMIN_USERS"
id = "9dd2c3346dd84a148dea9fa2f4f825f4"
