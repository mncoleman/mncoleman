name = "mncoleman-admin-auth"
main = "index.ts"
compatibility_date = "2024-04-01"

# Public environment variables
# Secrets (set via `wrangler secret put`):
#   TELEGRAM_CLIENT_SECRET  — OIDC client secret from BotFather
#   JWT_SECRET              — Signs session JWTs
#   OWNER_SUB               — Owner's Telegram OIDC sub (always allowed)
#   GITHUB_TOKEN            — GitHub API access (artifacts manifest commits)
#   PAGES_DEPLOY_HOOK       — Cloudflare Pages deploy hook URL; rebuilds mncoleman.com
#   ARTIFACTS_JWT_SECRET    — Shared HS256 secret with the Oracle artifact service
#   GA_SA_CLIENT_EMAIL      — Google service-account email (Viewer on the GA4 property)
#   GA_SA_PRIVATE_KEY       — That service account's PKCS#8 private key (PEM)
#   BUILD_TOKEN             — Shared secret the Cloudflare Pages build sends to claim
#                             a CalVer deployment number (same value as the Pages
#                             project's BUILD_TOKEN build variable)
#   GOOGLE_CLIENT_ID        — Google sign-in: the SAME OAuth client app.mncoleman.com uses.
#   GOOGLE_CLIENT_SECRET      Its redirect URIs must include
#                             https://mncoleman-admin-auth.mncoleman.workers.dev/auth/google/callback
#   OWNER_EMAIL             — (optional) owner's Google address; super_admin via Google
[vars]
TELEGRAM_BOT_ID = "8681257901"  # mncolemandotcombot — OIDC client_id
FRONTEND_URL = "https://mncoleman.com"
GITHUB_REPO_OWNER = "mncoleman"
GITHUB_REPO_NAME = "mncoleman"
N8N_WEBHOOK_URL = ""
ARTIFACTS_SERVICE_URL = "https://artifacts.mncoleman.com"
GA_PROPERTY_ID = "515551096"    # GA4 numeric property id — not the G- measurement id
MCP_RESOURCE_URL = "https://mncoleman.com/mcp/admin"  # the authenticated MCP endpoint (worker-mcp); OAuth tokens are issued for it alone

# Daily content rebuild (06:00 UTC), replacing the old deploy.yml `schedule:`.
[triggers]
crons = ["0 6 * * *"]

[[kv_namespaces]]
binding = "ADMIN_USERS"
id = "9dd2c3346dd84a148dea9fa2f4f825f4"

# Blog post drafts (autosave target for /admin/posts). Drafts never touch git: only Publish
# commits data/posts/<slug>.md. Left COMMENTED OUT on purpose: an active binding with a
# placeholder id makes `wrangler deploy` fail. Until it is enabled the Worker still deploys and
# the draft routes answer 503 `drafts_unavailable` (the editor then keeps edits in the browser).
#
# One-time setup:
#   1. cd worker && npx wrangler kv namespace create POST_DRAFTS
#   2. Uncomment the block below and paste the id it printed in place of <ID>.
#   3. npx wrangler deploy
#
[[kv_namespaces]]
binding = "POST_DRAFTS"
id = "1f42efc2796b4f6e96305ef767820fd0"
