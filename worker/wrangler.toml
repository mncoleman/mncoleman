name = "mncoleman-admin-auth"
main = "index.ts"
compatibility_date = "2024-04-01"

# Public environment variables
# Secrets (set via `wrangler secret put`):
#   TELEGRAM_CLIENT_SECRET  — OIDC client secret from BotFather
#   JWT_SECRET              — Signs session JWTs
#   OWNER_SUB               — Owner's Telegram OIDC sub (always allowed)
#   GITHUB_TOKEN            — GitHub API access
[vars]
TELEGRAM_BOT_ID = "8681257901"  # mncolemandotcombot — OIDC client_id
FRONTEND_URL = "https://mncoleman.com"
GITHUB_REPO_OWNER = "mncoleman"
GITHUB_REPO_NAME = "mncoleman"
N8N_WEBHOOK_URL = ""

[[kv_namespaces]]
binding = "ADMIN_USERS"
id = "9dd2c3346dd84a148dea9fa2f4f825f4"
