name = "mncoleman-admin-auth"
main = "index.ts"
compatibility_date = "2024-04-01"

# Environment variables (secrets should be set via `wrangler secret put`)
# ALLOWED_USER_ID is stored as a Wrangler secret (set via `wrangler secret put ALLOWED_USER_ID`)
[vars]
GITHUB_REPO_OWNER = "mncoleman"
GITHUB_REPO_NAME = "mncoleman"
N8N_WEBHOOK_URL = "" # Optional webhook URL for n8n workflows

# KV Namespace binding (optional, for session storage if needed later)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "<id>"
