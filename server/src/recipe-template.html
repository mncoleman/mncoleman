<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Recipes</title>
{{head}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2e7d32;
    --green-deep: #1b5e20;
    --green-wash: #edf5ee;
    --green-tint: #f6faf6;
    --ink: #1c1f1c;
    --muted: #5d665e;
    --paper: #f4f1ea;
    --card: #ffffff;
    --rule: 1.5px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(rgba(46,125,50,.06) 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink);
    font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .rc-page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }

  .rc-toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 18px; }
  .rc-btn {
    font: 500 13px/1 Inter, system-ui, sans-serif; color: var(--green-deep); text-decoration: none;
    background: var(--card); border: 1px solid rgba(46,125,50,.35); border-radius: 999px;
    padding: 9px 14px; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .rc-btn:hover { background: var(--green-wash); border-color: var(--green); }
  .rc-btn:first-child { margin-right: auto; }

  .rc-card {
    background: var(--card); border-radius: 18px; padding: 34px 36px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 40px -12px rgba(27,94,32,.18);
    border-top: 6px solid var(--green);
  }
  .rc-head { display: grid; gap: 10px; margin-bottom: 24px; }
  .rc-eyebrow { font: 600 11px/1 Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; margin: 0; color: var(--green-deep); letter-spacing: -.01em; }
  .rc-summary { margin: 0; color: var(--muted); font-size: 16px; max-width: 70ch; }
  .rc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .rc-chip { display: inline-flex; align-items: baseline; gap: 6px; background: var(--green-wash); border-radius: 8px; padding: 6px 10px; }
  .rc-chip-k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--green); }
  .rc-chip-v { font-weight: 600; }
  .rc-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .rc-tag { font-size: 12px; color: var(--muted); border: 1px solid #d9ded9; border-radius: 999px; padding: 2px 9px; }

  /* The chart. Every box draws its own right and bottom rule; the frame draws the top and left. */
  .rc-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .rc-scroll::-webkit-scrollbar { display: none; }
  .rc-chart {
    display: grid;
    grid-template-columns: minmax(250px, 2.4fr) repeat(var(--rc-cols), minmax(92px, 1fr));
    min-width: calc(250px + var(--rc-cols) * 92px);
    border-top: var(--rule) solid var(--green); border-left: var(--rule) solid var(--green);
    border-radius: 10px; overflow: hidden;
  }
  .rc-chart > * { border-right: var(--rule) solid var(--green); border-bottom: var(--rule) solid var(--green); }
  .rc-setup {
    text-align: center; padding: 10px 14px; font-weight: 500; background: var(--green-tint);
  }
  .rc-setup:first-child::before { content: "Before you start  ·  "; color: var(--green); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .rc-ing { padding: 9px 14px; display: block; }
  .rc-ing:nth-child(even) { background: #fcfdfc; }
  .rc-amt { font-weight: 600; }
  .rc-metric { color: var(--muted); font-size: .86em; }
  .rc-note { color: var(--muted); }
  .rc-step {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 8px; text-align: center; font-weight: 500; line-height: 1.25;
    background: linear-gradient(180deg, var(--green-tint), #fff 60%);
  }
  .rc-final { background: var(--green-wash); font-weight: 600; color: var(--green-deep); }
  .rc-n {
    flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    font: 600 10px/1 Inter, sans-serif; color: #fff; background: var(--green);
  }
  .rc-blank { background: repeating-linear-gradient(135deg, transparent 0 7px, rgba(46,125,50,.05) 7px 8px); }

  .rc-foot { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 22px; }
  .rc-notes { background: #fbfaf6; border-left: 4px solid var(--green); border-radius: 8px; padding: 12px 16px; font-size: .93em; }
  .rc-notes h2 { font: 600 12px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--green); margin: 2px 0 8px; }
  .rc-notes p { margin: 0 0 8px; } .rc-notes p:last-child { margin: 0; }
  .rc-credit { font-size: 12.5px; color: var(--muted); border-top: 1px solid #e3e7e3; padding-top: 10px; }
  .rc-credit a { color: var(--green-deep); }

  @media (max-width: 640px) {
    .rc-page { padding: 16px 10px 40px; }
    .rc-card { padding: 22px 16px 18px; border-radius: 14px; }
  }

  /* Paper: landscape letter, no page chrome, everything on one sheet where it fits. */
  @page { size: letter landscape; margin: .4in; }
  @media print {
    body { background: #fff; font-size: 10.5px; line-height: 1.3; }
    .rc-page { max-width: none; padding: 0; }
    [data-rc-toolbar] { display: none !important; }
    .rc-card { box-shadow: none; border-radius: 0; padding: 0; border-top: 0; }
    .rc-head { margin-bottom: 8px; gap: 4px; }
    .rc-eyebrow, .rc-tags { display: none; }
    h1 { font-size: 22px; }
    .rc-summary { font-size: 11px; }
    .rc-chip { padding: 2px 7px; }
    .rc-scroll { overflow: visible; }
    .rc-chart { min-width: 0; border-radius: 0; grid-template-columns: minmax(0, 2.4fr) repeat(var(--rc-cols), minmax(0, 1fr)); break-inside: avoid; }
    .rc-setup { padding: 4px 8px; }
    .rc-ing { padding: 3px 8px; }
    .rc-step { padding: 4px 4px; gap: 3px; }
    .rc-n { width: 14px; height: 14px; font-size: 8px; }
    .rc-foot { margin-top: 8px; gap: 6px; }
    .rc-notes { padding: 6px 10px; font-size: 9.5px; }
    .rc-notes h2 { margin: 0 0 3px; font-size: 9px; }
    .rc-notes p { margin: 0 0 3px; }
    .rc-credit { font-size: 9px; padding-top: 5px; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<main class="rc-page">
  {{toolbar}}
  <article class="rc-card">
    <header class="rc-head">
      <div class="rc-eyebrow">Recipe</div>
      <h1>{{title}}</h1>
      {{#summary}}<p class="rc-summary">{{summary}}</p>{{/summary}}
      {{#meta}}<div class="rc-chips">{{meta}}</div>{{/meta}}
      {{#tags}}<div class="rc-tags">{{tags}}</div>{{/tags}}
    </header>
    <div class="rc-scroll">{{chart}}</div>
    <footer class="rc-foot">
      {{#notes}}<section class="rc-notes"><h2>Notes</h2>{{notes}}</section>{{/notes}}
      <div class="rc-credit">{{credit}} {{approx}}</div>
    </footer>
  </article>
</main>
</body>
</html>
